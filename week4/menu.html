<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;

        }

        button {
            background-color: rgb(249, 99, 46);
            color: white;
            border: none;
            border-radius: 5px;
            margin-right: 20px;
            padding: 10px 15px;
        }

        .bar {
            display: flex;
            justify-content: center;
            gap: 30px
        }

        .right {
            display: flex;
            justify-content: flex-end;
            gap: 20px;
            align-items: center;
        }

        .number {
            font-weight: bold;
        }

        .services {
            color: rgb(249, 99, 46);
        }

        @media screen and (max-width: 1530px) {
            .hamburger {
                display: none;
            }

        }

        @media screen and (max-width: 1100px) {
            .hamburger {
                display: flex;
            }

            .bar {
                display: none;
            }

            button {
                display: none;
            }
        }

        @media screen and (max-width: 700px) {

            .number {
                display: none;
            }

            .phone {
                display: none;
            }

            button {
                display: none;
            }

            .bar {
                display: none;
            }



        }
    </style>

</head>

<body>
    <div class="container">
        <img src="image/elementra.png" alt="logo" height="60px">

        <div class="bar">
            <div>Home</div>
            <div class="services">Services</div>
            <div>Work</div>
            <div>Project Details</div>
            <div>Contact</div>
        </div>

        <div class="right">
            <div class="phone"><img src="image/phone.png" alt="phone" height="50px"></div>
            <div class="number">555-123-4587</div>
            <div class="hamburger"><img src="image/hamburger.png" alt="hamburger" height="50px"></div>
            <div><button>Contact</button></div>
        </div>
    </div>

</body>

</html>
