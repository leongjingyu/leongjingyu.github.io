<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>
    <h1>Registration Form - Middle School</h1>

    <form action="/action_page.php">
        <div class="form-box">
            <div><label for="firstname">First name*</label><br>
                <input type="text" id="firstname"><br>
            </div>

            <div><label for="lastname">Last name*</label><br>
                <input type="text" id="lastname"><br>
            </div>

            <div><label for="date">Date of Birth*</label><br>
                <input type="date" id="date"><br>
            </div>

            <div><label for="email">Email Address*</label><br>
                <input type="email" id="email"><br>
            </div>

            <div><label for="hompage">Homepage URL</label><br>
                <input type="url" id="homepage"><br>
            </div>

            <div><label for="color">Favourite Colors</label>
                <select name="color" id="color">
                    <option value="blue">Blue</option>
                    <option value="green">Green</option>
                    <option value="red">Red</option>
                    <option value="yellow">Yellow</option>
                    <option value="purple">Purple</option>
                </select>
            </div>

            <div><label for="introduction">Bio/Self Introduction</label><br>
                <textarea id="introduction" name="introduction" rows="4" cols="50"></textarea>
            </div>

            <div><label for="button">Submit</label><br>
                <input type="submit" id="button"><br>
            </div>
        </div>
    </form>

</body>

</html>
